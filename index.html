<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="旻言教室中文學習平台。只填班別及班號，便可開始學習；支援基本版、進階版及多種學習輔助功能。">
    <title>旻言教室｜中文學習</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        color: #182b45;
        background: #f0f7f8;
        font-synthesis: none;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        background:
          radial-gradient(ellipse at 0% 0%, #dcf4ee 0, transparent 48%),
          radial-gradient(ellipse at 100% 100%, #e6e9fb 0, transparent 45%),
          #f0f7f8;
      }

      .page {
        width: min(100% - 40px, 1000px);
        margin-inline: auto;
        padding-block: 36px 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        border-radius: 15px;
        background: #0f766e;
        color: #fff;
        font-size: 27px;
        font-weight: 700;
        box-shadow: 0 5px 16px #0f766e1f;
      }

      .brand-name { margin: 0; font-size: 20px; font-weight: 750; }
      .brand-description { margin: 3px 0 0; color: #4b6075; font-size: 14px; }

      .card {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        gap: 40px;
        align-items: center;
        padding: clamp(28px, 5vw, 56px);
        border: 1px solid #d2e2e6;
        border-radius: 28px;
        background: #ffffff;
        box-shadow: 0 16px 48px #182b450d;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #0f766e;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 48px);
        line-height: 1.3;
        letter-spacing: -0.03em;
      }

      .intro {
        max-width: 26em;
        margin: 20px 0 24px;
        color: #40556b;
        font-size: 18px;
        line-height: 1.8;
      }

      .modes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }

      .mode {
        padding: 7px 12px;
        border: 1px solid #dce3f3;
        border-radius: 999px;
        background: #f0f2fb;
        color: #373f82;
        font-size: 14px;
        font-weight: 650;
      }

      .start {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        min-width: 200px;
        min-height: 56px;
        padding: 14px 24px;
        border: 2px solid transparent;
        border-radius: 14px;
        background: linear-gradient(120deg, #0f766e, #24548b);
        color: #fff;
        font-size: 19px;
        font-weight: 750;
        line-height: 1.25;
        text-decoration: none;
        box-shadow: 0 6px 18px #0f766e26;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .start:hover { transform: translateY(-2px); box-shadow: 0 10px 24px #0f766e38; }
      .start:active { transform: translateY(0); box-shadow: 0 3px 9px #0f766e26; }
      .start:focus-visible { outline: 3px solid #4338ca; outline-offset: 5px; }
      .start svg { width: 22px; height: 22px; flex: 0 0 auto; }

      .status { margin: 14px 0 0; color: #4b6075; font-size: 14px; line-height: 1.7; }

      .support {
        padding: 28px;
        border: 1px solid #b7dcd7;
        border-radius: 22px;
        background: #edf8f5;
      }

      .support-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 20px;
        border: 1px solid #cae7df;
        border-radius: 16px;
        background: #ffffff;
        color: #0f766e;
      }

      .support-icon svg { width: 28px; height: 28px; }
      h2 { margin: 0; font-size: 25px; line-height: 1.5; }
      .support p { margin: 16px 0 0; color: #345f59; font-size: 16px; line-height: 1.9; }

      footer { margin-top: 26px; color: #4b6075; text-align: center; font-size: 14px; line-height: 1.8; }

      @media (max-width: 700px) {
        .page { width: min(100% - 32px, 480px); padding-top: 24px; }
        .brand { margin-bottom: 24px; }
        .card { grid-template-columns: 1fr; gap: 28px; border-radius: 22px; }
        .intro { font-size: 17px; }
        .start { width: 100%; }
        .support { padding: 22px; }
        .support-icon { margin-bottom: 14px; }
        h2 { font-size: 23px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .start { transition: none; }
        .start:hover, .start:active { transform: none; }
      }

      @media (forced-colors: active) {
        .start { border-color: ButtonText; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">言</span>
        <div>
          <p class="brand-name">旻言教室</p>
          <p class="brand-description">中文學習平台</p>
        </div>
      </header>

      <main class="card">
        <section aria-labelledby="welcome-title">
          <p class="eyebrow">每一步，都有進步</p>
          <h1 id="welcome-title">歡迎來到<br>旻言教室</h1>
          <p class="intro">只填班別及班號，便可開始學習。選擇適合自己的步伐，一起練習中文。</p>
          <div class="modes" aria-label="可選學習版本">
            <span class="mode">基本版</span>
            <span class="mode">進階版</span>
          </div>
          <a class="start" id="start-learning" href="https://script.google.com/macros/s/AKfycbycEOpljFFFdHSKUlsHuFz_qptY2z9zsqRDft0NAaBa5xLyCPAe-QaPs3Ib4w_XhMbo/exec" rel="noreferrer">
            <span>開始學習</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </a>
          <p class="status" id="launch-status" role="status">正在開啟課室；如未自動前往，請按「開始學習」。</p>
        </section>

        <aside class="support" aria-labelledby="support-title">
          <div class="support-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-3-2-6-2-9-1v13c3-1 6-1 9 1 3-2 6-2 9-1V6c-3-1-6-1-9 1Z"></path><path d="M12 7v13M6 10h3M6 13h3M15 10h3M15 13h3"></path></svg>
          </div>
          <h2 id="support-title">按步學習，<br>慢慢累積</h2>
          <p>朗讀、大字、提示、專注底線與休息功能，在兩個版本都可使用。</p>
        </aside>
      </main>

      <footer>一步一步，建立信心。</footer>
    </div>
    <script>
      (() => {
        'use strict';
        const status = document.getElementById('launch-status');
        const destination = document.getElementById('start-learning').href;
        if (new URLSearchParams(window.location.search).get('stay') === '1') {
          status.textContent = '按「開始學習」進入課室。';
          return;
        }
        try {
          window.location.replace(destination);
        } catch (error) {
          status.textContent = '請按「開始學習」進入課室。';
        }
      })();
    </script>
  </body>
</html>
